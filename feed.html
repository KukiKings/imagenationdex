<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#090A10">
  <title>IN$DEX — Interest Feed</title>
  <style>
    :root{
      --cyan:#00D4FF;--blue:#2B35D8;--purple:#8B3FE8;
      --black:#090A10;--green:#00E5A0;--gold:#FFB800;
      --red:#FF4D6D;--surface:#12141F;--surface2:#1A1D2E;
      --surface3:#22263A;--text:#F0F2FF;--text2:#B0B8D8;
      --muted:rgba(176,184,216,0.45);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html{background:var(--black);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
    body{min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom));}

    /* TOPBAR */
    .topbar{position:sticky;top:0;z-index:20;background:rgba(9,10,16,0.96);backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.06);
      padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));}
    .topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .topbar-logo{font-size:18px;font-weight:900;
      background:linear-gradient(135deg,var(--cyan),var(--purple));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .topbar-tag{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
    .si-curator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);}
    .si-curator-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    /* FILTER CHIPS */
    .filter-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
    .filter-scroll::-webkit-scrollbar{display:none;}
    .filter-chip{background:var(--surface2);border:1px solid rgba(255,255,255,0.09);border-radius:20px;
      padding:7px 14px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;
      flex-shrink:0;font-family:inherit;transition:all .2s;white-space:nowrap;}
    .filter-chip.active,.filter-chip:active{background:rgba(0,212,255,0.1);border-color:var(--cyan);color:var(--cyan);}

    /* FEED */
    .feed{padding:16px 16px 0;}

    /* ── STORY CARD ── */
    .story-card{background:var(--surface);border:1px solid rgba(255,255,255,0.07);
      border-radius:20px;padding:18px;margin-bottom:14px;
      opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .45s ease;}
    .story-card.visible{opacity:1;transform:translateY(0);}
    .story-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
    .story-avi{width:48px;height:48px;border-radius:50%;background:var(--surface2);
      display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;
      border:2px solid rgba(255,255,255,0.08);}
    .creator-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;}
    .creator-loc{font-size:11px;color:var(--muted);}
    .card-type-badge{margin-left:auto;flex-shrink:0;font-size:10px;font-weight:700;
      letter-spacing:1px;text-transform:uppercase;color:var(--muted);border:1px solid rgba(255,255,255,0.1);
      border-radius:8px;padding:3px 8px;}
    .story-text{font-size:14px;line-height:1.65;color:var(--text2);margin-bottom:14px;}
    .story-text strong{color:var(--text);font-weight:600;}

    /* Product tag on story cards */
    .product-tag{display:flex;align-items:center;justify-content:space-between;
      background:var(--surface2);border:1px solid rgba(0,212,255,0.15);border-radius:14px;padding:10px 14px;}
    .product-tag-left{display:flex;align-items:center;gap:10px;}
    .product-tag-img{font-size:22px;}
    .product-tag-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px;}
    .product-tag-price{font-size:12px;color:var(--cyan);font-weight:700;}
    .product-tag-btn{background:linear-gradient(135deg,rgba(43,53,216,0.8),rgba(0,212,255,0.7));
      border:none;border-radius:10px;padding:7px 12px;font-size:11px;font-weight:800;
      color:#fff;cursor:pointer;font-family:inherit;white-space:nowrap;transition:opacity .2s;}
    .product-tag-btn:active{opacity:.75;}

    /* ── EVENT CARD ── */
    .event-card{background:linear-gradient(135deg,rgba(43,53,216,0.12),rgba(139,63,232,0.08));
      border:1px solid rgba(43,53,216,0.3);border-radius:20px;padding:18px;margin-bottom:14px;
      opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .45s ease;}
    .event-card.visible{opacity:1;transform:translateY(0);}
    .event-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
    .event-icon{width:48px;height:48px;border-radius:14px;background:rgba(139,63,232,0.2);
      display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
    .event-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:3px;}
    .event-when{font-size:12px;color:var(--purple);font-weight:700;}
    .event-loc{font-size:11px;color:var(--muted);margin-top:2px;}
    .event-desc{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:14px;}
    .event-meta{display:flex;align-items:center;gap:12px;}
    .event-attending{font-size:12px;color:var(--muted);}
    .event-attending strong{color:var(--green);}
    .btn-event{background:rgba(139,63,232,0.15);border:1px solid rgba(139,63,232,0.35);
      border-radius:12px;padding:8px 16px;font-size:12px;font-weight:700;color:var(--purple);
      cursor:pointer;font-family:inherit;transition:all .2s;}
    .btn-event:active{background:rgba(139,63,232,0.25);}

    /* ── BEHIND SCENES CARD ── */
    .behind-card{background:var(--surface);border:1px solid rgba(255,255,255,0.07);
      border-radius:20px;overflow:hidden;margin-bottom:14px;
      opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .45s ease;}
    .behind-card.visible{opacity:1;transform:translateY(0);}
    .behind-visual{height:160px;background:linear-gradient(135deg,var(--surface2),var(--surface3));
      display:flex;align-items:center;justify-content:center;position:relative;}
    .behind-play{width:52px;height:52px;border-radius:50%;background:rgba(0,212,255,0.15);
      border:2px solid rgba(0,212,255,0.4);display:flex;align-items:center;justify-content:center;
      font-size:20px;cursor:pointer;}
    .behind-label{position:absolute;top:10px;left:12px;background:rgba(9,10,16,0.8);
      border-radius:8px;padding:4px 10px;font-size:10px;font-weight:700;color:var(--cyan);
      letter-spacing:1px;text-transform:uppercase;}
    .behind-big-emoji{font-size:64px;opacity:.18;position:absolute;}
    .behind-body{padding:16px;}
    .behind-creator{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .behind-avi{width:36px;height:36px;border-radius:50%;background:var(--surface2);
      display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .behind-text{font-size:14px;line-height:1.55;color:var(--text2);margin-bottom:12px;}

    /* ── TREND STRIP ── */
    .trend-strip{background:rgba(0,229,160,0.05);border:1px solid rgba(0,229,160,0.15);
      border-radius:18px;padding:14px 16px;margin-bottom:14px;}
    .trend-strip-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
      color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
    .trend-strip-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
    .trend-items{display:flex;flex-direction:column;gap:7px;}
    .trend-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);}
    .trend-rank{font-size:11px;font-weight:700;color:var(--muted);width:16px;}
    .trend-name{flex:1;}
    .trend-delta{font-size:11px;font-weight:700;color:var(--green);}

    /* ── LOAD MORE ── */
    .load-more-btn{width:100%;margin:0 0 16px;padding:13px;background:transparent;
      border:1px solid rgba(255,255,255,0.1);border-radius:16px;color:var(--text2);
      font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
    .load-more-btn:active{border-color:var(--cyan);color:var(--cyan);}

    /* SIINDEX CURATION FOOTER */
    .si-footer{text-align:center;padding:8px 16px 20px;font-size:11px;color:var(--muted);}
    .si-footer span{color:var(--cyan);}

    /* BOTTOM NAV */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;
      background:rgba(9,10,16,0.97);backdrop-filter:blur(12px);
      border-top:1px solid rgba(255,255,255,0.06);
      display:flex;padding-bottom:env(safe-area-inset-bottom);}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:10px 4px 8px;text-decoration:none;color:var(--muted);
      font-size:10px;font-weight:600;letter-spacing:.3px;gap:3px;transition:color .2s;}
    .nav-item.active{color:var(--cyan);}
    .nav-icon{font-size:20px;}

    /* GOD MODE: LIKE / SAVED SHEET / TOAST / PULL-REFRESH */
    .like-btn{display:flex;align-items:center;gap:5px;background:transparent;border:none;
      cursor:pointer;font-family:inherit;padding:4px 2px;margin-left:auto;flex-shrink:0;}
    .like-heart{font-size:16px;transition:transform .2s;}
    .like-btn:active .like-heart{transform:scale(1.3);}
    .like-count{font-size:11px;font-weight:700;color:var(--muted);}
    .like-btn.liked .like-count{color:var(--red);}

    .saved-fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:22;
      width:52px;height:52px;border-radius:50%;
      background:linear-gradient(135deg,var(--blue),var(--purple));
      border:1px solid rgba(255,255,255,0.15);box-shadow:0 8px 20px rgba(43,53,216,0.35);
      display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#fff;}
    .saved-fab-badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 4px;
      border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;
      display:flex;align-items:center;justify-content:center;border:2px solid var(--black);}

    .sheet-overlay{position:fixed;inset:0;background:rgba(9,10,16,0.7);z-index:30;
      opacity:0;pointer-events:none;transition:opacity .25s ease;}
    .sheet-overlay.open{opacity:1;pointer-events:auto;}
    .bottom-sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:430px;margin:0 auto;
      background:var(--surface);border-radius:22px 22px 0 0;border:1px solid rgba(255,255,255,0.08);
      border-bottom:none;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
      max-height:70vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease;}
    .bottom-sheet.open{transform:translateY(0);}
    .sheet-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.15);
      margin:0 auto 14px;}
    .sheet-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .sheet-title{font-size:15px;font-weight:800;color:var(--text);}
    .sheet-close{background:var(--surface2);border:1px solid rgba(255,255,255,0.08);border-radius:50%;
      width:28px;height:28px;color:var(--text2);font-size:14px;cursor:pointer;font-family:inherit;}
    .saved-item{display:flex;align-items:center;gap:10px;padding:10px 0;
      border-bottom:1px solid rgba(255,255,255,0.06);}
    .saved-item:last-child{border-bottom:none;}
    .saved-item-avi{width:36px;height:36px;border-radius:50%;background:var(--surface2);
      display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .saved-item-body{flex:1;min-width:0;}
    .saved-item-name{font-size:13px;font-weight:700;color:var(--text);}
    .saved-item-loc{font-size:11px;color:var(--muted);}
    .saved-item-remove{background:transparent;border:none;color:var(--muted);font-size:14px;
      cursor:pointer;padding:6px;font-family:inherit;}
    .saved-empty{font-size:13px;color:var(--muted);text-align:center;padding:24px 12px;line-height:1.6;}

    .toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));
      transform:translateX(-50%) translateY(12px);background:var(--surface3);
      border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:11px 18px;
      font-size:12.5px;font-weight:600;color:var(--text);z-index:40;
      opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
      max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(9,10,16,0.4);}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    .pull-refresh-indicator{display:flex;align-items:center;justify-content:center;gap:8px;
      height:0;overflow:hidden;opacity:0;transition:height .2s ease,opacity .2s ease;
      font-size:12px;font-weight:700;color:var(--cyan);}
    .pull-refresh-indicator.active{height:44px;opacity:1;}
    .pull-refresh-spinner{width:16px;height:16px;border-radius:50%;
      border:2px solid rgba(0,212,255,0.25);border-top-color:var(--cyan);
      animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="topbar-logo">IN$DEX</div>
    <div class="si-curator">
      <span class="si-curator-dot"></span>
      Curated by SIINDEX · Synthetic Intelligence
    </div>
  </div>
  <!-- FIXED 2026-07-25: was presented with no indication this is example content — the
       creators, "attending" counts, and trend percentages below are illustrative preview
       content, not live citizen activity (no real feed backend exists yet). See gotchas.md. -->
  <div style="font-size:11px;color:var(--gold);background:rgba(255,184,0,0.08);border:1px solid rgba(255,184,0,0.2);border-radius:10px;padding:8px 12px;margin-top:10px;line-height:1.5;">🔔 Preview — example stories showing what the Feed will look like. Not live citizen activity yet.</div>
  <div class="filter-scroll" id="filterRow">
    <button class="filter-chip active" onclick="setFilter(this,'all')">✨ All</button>
    <button class="filter-chip" onclick="setFilter(this,'local')">📍 Local</button>
    <button class="filter-chip" onclick="setFilter(this,'makers')">🛠 Makers</button>
    <button class="filter-chip" onclick="setFilter(this,'food')">🌿 Food</button>
    <button class="filter-chip" onclick="setFilter(this,'events')">🎟 Events</button>
    <button class="filter-chip" onclick="setFilter(this,'arts')">🎨 Arts</button>
    <button class="filter-chip" onclick="setFilter(this,'behind')">🎬 Behind-scenes</button>
  </div>
</header>

<div class="pull-refresh-indicator" id="pullRefreshIndicator"><span class="pull-refresh-spinner"></span><span>Refreshing feed…</span></div>

<main class="feed" id="feedContainer"></main>

<nav class="bottom-nav">
  <a href="home-v2.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
  <a href="marketplace.html" class="nav-item"><span class="nav-icon">🛒</span><span>Market</span></a>
  <a href="feed.html" class="nav-item active"><span class="nav-icon">✨</span><span>Feed</span></a>
  <a href="siindex-avatar.html" class="nav-item"><span class="nav-icon">🤖</span><span>SIINDEX</span></a>
  <!-- Wallet nav target confirmed by AJ 2026-07-14: portfolio.html (holdings screen) -->
  <a href="portfolio.html" class="nav-item"><span class="nav-icon">👛</span><span>Wallet</span></a>
</nav>

<!-- GOD MODE: saved stories FAB + bottom sheet + toast -->
<button class="saved-fab" id="savedFab" onclick="openSavedSheet()" aria-label="Saved stories">❤️<span class="saved-fab-badge" id="savedFabBadge" style="display:none;">0</span></button>

<div class="sheet-overlay" id="savedOverlay" onclick="closeSavedSheet()"></div>
<div class="bottom-sheet" id="savedSheet" role="dialog" aria-modal="true" aria-labelledby="savedSheetTitle">
  <div class="sheet-handle"></div>
  <div class="sheet-title-row">
    <div class="sheet-title" id="savedSheetTitle">Saved Stories</div>
    <button class="sheet-close" onclick="closeSavedSheet()" aria-label="Close saved stories">✕</button>
  </div>
  <div id="savedList"></div>
</div>

<div class="toast" id="toastEl"></div>

<script>
const INDX_PRICE_USD = 0.24;

// ── GOD MODE: LIKE / SAVED SHEET / TOAST / PULL-REFRESH ──
function isLiked(creator) {
  const liked = JSON.parse(localStorage.getItem('indx_feed_liked') || '[]');
  return liked.includes(creator);
}
function getBaseLikeCount(creator) {
  let hash = 0;
  for (let i = 0; i < creator.length; i++) hash = (hash * 31 + creator.charCodeAt(i)) % 89;
  return 14 + hash;
}
function getLikeCount(creator) {
  return getBaseLikeCount(creator) + (isLiked(creator) ? 1 : 0);
}
function setLiked(creator, liked) {
  let arr = JSON.parse(localStorage.getItem('indx_feed_liked') || '[]');
  arr = arr.filter(c => c !== creator);
  if (liked) arr.push(creator);
  localStorage.setItem('indx_feed_liked', JSON.stringify(arr));
}
function toggleLike(btn, creator) {
  const nowLiked = !isLiked(creator);
  setLiked(creator, nowLiked);
  btn.classList.toggle('liked', nowLiked);
  const heart = btn.querySelector('.like-heart');
  const count = btn.querySelector('.like-count');
  if (heart) heart.textContent = nowLiked ? '❤️' : '🤍';
  if (count) count.textContent = getLikeCount(creator);
  showToast(nowLiked ? 'Saved to your liked stories' : 'Removed from liked stories');
  updateSavedFabBadge();
  renderSavedSheetContent();
}
function updateSavedFabBadge() {
  const liked = JSON.parse(localStorage.getItem('indx_feed_liked') || '[]');
  const badge = document.getElementById('savedFabBadge');
  if (!badge) return;
  if (liked.length > 0) {
    badge.style.display = 'flex';
    badge.textContent = liked.length;
  } else {
    badge.style.display = 'none';
  }
}
function openSavedSheet() {
  renderSavedSheetContent();
  document.getElementById('savedSheet').classList.add('open');
  document.getElementById('savedOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  const closeBtn = document.querySelector('#savedSheet .sheet-close');
  if (closeBtn) closeBtn.focus();
}
function closeSavedSheet() {
  document.getElementById('savedSheet').classList.remove('open');
  document.getElementById('savedOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function renderSavedSheetContent() {
  const liked = JSON.parse(localStorage.getItem('indx_feed_liked') || '[]');
  const listEl = document.getElementById('savedList');
  if (!listEl) return;
  if (!liked.length) {
    listEl.innerHTML = `<div class="saved-empty">No saved stories yet. Tap the heart on any story or behind-the-scenes post to save it here.</div>`;
    return;
  }
  const items = FEED_ITEMS.filter(it => (it.type === 'story' || it.type === 'behind') && liked.includes(it.creator));
  listEl.innerHTML = items.map(it => `<div class="saved-item">
    <div class="saved-item-avi">${it.avi}</div>
    <div class="saved-item-body">
      <div class="saved-item-name">${it.creator}</div>
      <div class="saved-item-loc">📍 ${it.loc}</div>
    </div>
    <button class="saved-item-remove" onclick="removeSaved('${it.creator.replace(/'/g,"\\'")}')" aria-label="Remove from saved">✕</button>
  </div>`).join('');
}
function removeSaved(creator) {
  setLiked(creator, false);
  showToast('Removed from liked stories');
  updateSavedFabBadge();
  renderSavedSheetContent();
  renderFeed();
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toastEl');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

let pullStartY = 0;
let pullActive = false;
function initPullToRefresh() {
  const container = document.getElementById('feedContainer');
  const indicator = document.getElementById('pullRefreshIndicator');
  if (!container || !indicator) return;
  container.addEventListener('touchstart', (e) => {
    pullActive = window.scrollY <= 2;
    pullStartY = e.touches[0].clientY;
  }, {passive:true});
  container.addEventListener('touchmove', (e) => {
    if (!pullActive) return;
    const dy = e.touches[0].clientY - pullStartY;
    if (dy > 60) indicator.classList.add('active');
  }, {passive:true});
  container.addEventListener('touchend', () => {
    if (pullActive && indicator.classList.contains('active')) refreshFeed();
    indicator.classList.remove('active');
    pullActive = false;
  });
}
function refreshFeed() {
  const indicator = document.getElementById('pullRefreshIndicator');
  if (indicator) indicator.classList.add('active');
  setTimeout(() => {
    visibleCount = 7;
    renderFeed();
    if (indicator) indicator.classList.remove('active');
    showToast('Feed refreshed');
  }, 600);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSavedSheet();
});

// ── FEED DATA ──
const FEED_ITEMS = [
  {
    type:'story', filter:['all','local','makers'],
    creator:'Litia V.', loc:'Suva, Fiji', avi:'👩‍🎨',
    text:`I've been weaving tapa cloth since I was nine years old. My grandmother taught me. Each pattern is a word in a language most people have forgotten — I'm keeping it alive one piece at a time.`,
    product:{img:'🎨', title:'Tapa Cloth Wall Art', indx:85}
  },
  {
    type:'behind', filter:['all','makers','behind'],

let activeFilter = 'all';
let visibleCount = 7;

function setFilter(el, filter) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeFilter = filter;
  visibleCount = 7;
  renderFeed();
}

function renderFeed() {
  const container = document.getElementById('feedContainer');
  if (!container) return;

  const filtered = FEED_ITEMS.filter(item => activeFilter === 'all' || item.filter.includes(activeFilter));
  const shown = filtered.slice(0, visibleCount);

  container.innerHTML = shown.map((item, i) => renderItem(item, i)).join('') +
    (filtered.length > visibleCount ?
      `<button class="load-more-btn" onclick="loadMore()">Load more stories →</button>` : '') +
    <!-- FIXED 2026-07-25: removed false "Updates continuously" claim — this is a static preview list, not a live-updating feed -->
    `<div class="si-footer">Curated by <span>SIINDEX</span> · Synthetic Intelligence · Preview content</div>`;

  // Staggered card reveal
  requestAnimationFrame(() => {
    container.querySelectorAll('.story-card,.event-card,.behind-card,.trend-strip').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), i * 90);
    });
  });
}

function renderItem(item, i) {
  if (item.type === 'story') return renderStory(item);
  if (item.type === 'event') return renderEvent(item);
  if (item.type === 'behind') return renderBehind(item);
  if (item.type === 'trend') return renderTrend(item);
  return '';
}

function renderStory(item) {
  const usd = item.product ? (item.product.indx * INDX_PRICE_USD).toFixed(2) : null;
  // GOD MODE PATCH: real like/save state (was dead code — computed but never rendered)
  const liked = isLiked(item.creator);
  const likeCount = getLikeCount(item.creator);
  const creatorEsc = item.creator.replace(/'/g,"\\'");
  return `<article class="story-card">
    <div class="story-header">
      <div class="story-avi">${item.avi}</div>
      <div>
        <div class="creator-name">${item.creator}</div>
        <div class="creator-loc">📍 ${item.loc}</div>
      </div>
      <div class="card-type-badge">Story</div>
      <button class="like-btn ${liked ? 'liked' : ''}" onclick="toggleLike(this,'${creatorEsc}')" aria-label="Like ${creatorEsc}'s story">
        <span class="like-heart">${liked ? '❤️' : '🤍'}</span><span class="like-count">${likeCount}</span>
      </button>
    </div>
    <p class="story-text">${item.text}</p>
    ${item.product ? `<div class="product-tag">
      <div class="product-tag-left">
        <div class="product-tag-img">${item.product.img}</div>
        <div>
          <div class="product-tag-title">${item.product.title}</div>
          <div class="product-tag-price">💎 ${item.product.indx} INDX · $${usd}</div>
        </div>
      </div>
      <button class="product-tag-btn" onclick="viewListing('${item.creator}')">View →</button>
    </div>` : ''}
  </article>`;
}

function renderEvent(item) {
  return `<article class="event-card">
    <div class="event-header">
      <div class="event-icon">${item.icon}</div>
      <div>
        <div class="event-title">${item.title}</div>
        <div class="event-when">🗓 ${item.when}</div>
        <div class="event-loc">📍 ${item.loc}</div>
      </div>
    </div>
    <p class="event-desc">${item.desc}</p>
    <div class="event-meta">
      <div class="event-attending"><strong>${item.attending}</strong> going</div>
      <button class="btn-event" onclick="rsvpEvent(this,'${item.title}')">RSVP →</button>
    </div>
  </article>`;
}

function renderBehind(item) {
  const usd = item.product ? (item.product.indx * INDX_PRICE_USD).toFixed(2) : null;
  // GOD MODE PATCH: real like/save state on behind-the-scenes posts
  const liked = isLiked(item.creator);
  const likeCount = getLikeCount(item.creator);
  const creatorEsc = item.creator.replace(/'/g,"\\'");
  return `<article class="behind-card">
    <div class="behind-visual">
      <div class="behind-big-emoji">${item.bigEmoji}</div>
      <div class="behind-label">Behind-the-scenes</div>
      <div class="behind-play" onclick="playBehind('${item.creator}')">▶</div>
    </div>
    <div class="behind-body">
      <div class="behind-creator">
        <div class="behind-avi">${item.avi}</div>
        <div>
          <div class="creator-name">${item.creator}</div>
          <div class="creator-loc">📍 ${item.loc}</div>
        </div>
        <button class="like-btn ${liked ? 'liked' : ''}" onclick="toggleLike(this,'${creatorEsc}')" aria-label="Like ${creatorEsc}'s post">
          <span class="like-heart">${liked ? '❤️' : '🤍'}</span><span class="like-count">${likeCount}</span>
        </button>
      </div>
      <p class="behind-text">${item.text}</p>
      ${item.product ? `<div class="product-tag">
        <div class="product-tag-left">
          <div class="product-tag-img">${item.product.img}</div>
          <div>
            <div class="product-tag-title">${item.product.title}</div>
            <div class="product-tag-price">💎 ${item.product.indx} INDX · $${usd}</div>
          </div>
        </div>
        <button class="product-tag-btn" onclick="viewListing('${item.creator}')">View →</button>
      </div>` : ''}
    </div>
  </article>`;
}

function renderTrend(item) {
  return `<div class="trend-strip visible">
    <div class="trend-strip-label">
      <span class="trend-strip-dot"></span>
      Trending near you this week
    </div>
    <div class="trend-items">
      ${item.items.map(t => `<div class="trend-item">
        <span class="trend-rank">#${t.rank}</span>
        <span class="trend-name">${t.name}</span>
        <span class="trend-delta">${t.delta}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function loadMore() {
  visibleCount += 4;
  renderFeed();
}

// ── INTERACTIONS ──
function viewListing(creator) {
  window.location.href = `marketplace.html`;
}

function rsvpEvent(btn, title) {
  const key = `indx_feed_rsvp_${title.replace(/\s/g,'')}`;
  // GOD MODE PATCH: toast instead of alert() for a smoother mobile interaction
  if (localStorage.getItem(key)) {
    showToast(`You're already going to ${title}`);
    return;
  }
  localStorage.setItem(key, '1');
  btn.textContent = '✓ Going';
  btn.style.color = 'var(--green)';
  btn.style.borderColor = 'rgba(0,229,160,0.35)';
  showToast(`You're going to ${title}`);
}

function playBehind(creator) {
  // GOD MODE PATCH: toast instead of alert() for a smoother mobile interaction
  showToast(`Video from ${creator} coming in Wave 1 — save the listing, it's live in the marketplace`);
}

// ── SAVE SCROLL POSITION ──
function saveScroll() {
  localStorage.setItem('indx_feed_scroll', window.scrollY);
}
function restoreScroll() {
  const y = localStorage.getItem('indx_feed_scroll');
  if (y) window.scrollTo(0, parseInt(y));
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  renderFeed();
  setTimeout(restoreScroll, 100);
  window.addEventListener('scroll', saveScroll, {passive:true});
  // GOD MODE PATCH: pull-to-refresh + saved stories badge init
  initPullToRefresh();
  updateSavedFabBadge();
});
</script>
