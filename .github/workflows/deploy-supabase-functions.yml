name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID in GitHub Actions secrets."
            echo "Required once so SIINDEX Voice/Ops agents can deploy without founder UI work."
            exit 1
          fi
          supabase functions deploy siindex-website-voice-tts --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy siindex-website-voice-setup --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy siindex-website-runtime --project-ref "$SUPABASE_PROJECT_ID" || true
          supabase functions deploy siindex-website-transcribe --project-ref "$SUPABASE_PROJECT_ID" || true

      - name: Apply runtime config migration (best effort)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD" || true
            supabase db push --include-all || true
          else
            echo "SUPABASE_DB_PASSWORD not set — apply migration 20260809_siindex_runtime_config.sql from dashboard SQL if needed."
          fi
