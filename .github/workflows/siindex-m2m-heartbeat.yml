name: SIINDEX M2M heartbeat

on:
  schedule:
    # Every 30 minutes — always-on tick without a VPS
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: SIINDEX M2M tick
        working-directory: siindex-m2m
        run: node heartbeat.mjs once
