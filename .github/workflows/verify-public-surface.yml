name: Verify public surface

# Added 2026-09-05 (god mode Item 7, core stabilization). scripts/verify-*.mjs
# already existed in the repo but nothing ran them automatically — running
# them cold surfaced real drift (a routing gap that left internal dev/founder
# screens publicly reachable, plus stale canon copy) that had gone unnoticed
# for weeks. This wires the one that was fully rewritten and confirmed
# accurate (verify-public-surface.mjs) into CI so future drift is caught on
# every push instead of only when someone happens to run it by hand.
#
# scripts/verify-siindex-public-phase-a.mjs and scripts/verify-siindex-voice.mjs
# are NOT wired in yet — both check for an older, since-superseded voice-core
# architecture and need a real rewrite (not a quick fix) before they'd give
# a trustworthy signal. See memory.md Session 104/105.

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "vercel.json"
      - "robots.txt"
      - "sitemap.xml"
      - "sw.js"
      - "images/siindex-public-portrait.webp"
      - "images/siindex-public-video-poster.webp"
      - "supabase/functions/siindex-website-runtime/**"
      - "scripts/verify-public-surface.mjs"
      - ".github/workflows/verify-public-surface.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run public-surface verification
        run: node scripts/verify-public-surface.mjs
