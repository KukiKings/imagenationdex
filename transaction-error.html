<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Transaction Error IN$DEX</title>
<style>
  :root {
    --cyan: #00D4FF; --blue: #2B35D8; --purple: #8B3FE8;
    --black: #090A10; --green: #00E5A0; --gold: #FFB800;
    --red: #FF4D6D; --surface: #12141F; --surface2: #1A1D2E;
    --surface3: #22263A; --text: #F0F2FF; --text2: #A0A8C8;
    --text-muted: #5A6080;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--black); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; max-width:430px; margin:0 auto; min-height:100vh; }
  .topbar { background:var(--surface); border-bottom:1px solid rgba(255,255,255,0.06); padding:14px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:100; }
  .back-btn { width:36px; height:36px; border:none; background:var(--surface2); border-radius:10px; color:var(--text); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .topbar-title { font-size:16px; font-weight:600; }

  /* Error type tabs */
  .error-types { display:flex; gap:8px; padding:16px 16px 0; overflow-x:auto; scrollbar-width:none; }
  .error-types::-webkit-scrollbar { display:none; }
  .error-tab { padding:8px 14px; background:var(--surface); border:1px solid var(--surface3); border-radius:20px; color:var(--text2); font-size:12px; cursor:pointer; white-space:nowrap; transition:all 0.2s; flex-shrink:0; }
  .error-tab.active { background:rgba(255,77,109,0.15); border-color:rgba(255,77,109,0.4); color:var(--red); }

  .content { padding:16px; padding-bottom:120px; }

  /* Error hero */
  .error-hero { text-align:center; padding:24px 0 16px; }
  .error-icon-ring { width:80px; height:80px; border-radius:50%; border:3px solid var(--red); display:flex; align-items:center; justify-content:center; font-size:36px; margin:0 auto 16px; background:rgba(255,77,109,0.08); }
  .error-title { font-size:20px; font-weight:800; margin-bottom:6px; }
  .error-code { font-size:12px; color:var(--text-muted); font-family:monospace; background:var(--surface); padding:4px 12px; border-radius:20px; display:inline-block; }

  /* SIINDEX explanation */
  .si-card { background:var(--surface2); border-left:3px solid var(--cyan); border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; margin:16px 0; }
  .si-avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--cyan),var(--purple)); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .si-name { font-size:11px; color:var(--cyan); font-weight:600; margin-bottom:3px; letter-spacing:0.5px; }
  .si-text { font-size:13px; color:var(--text2); line-height:1.6; }

  /* What happened */
  .detail-card { background:var(--surface); border-radius:14px; margin-bottom:14px; overflow:hidden; }
  .detail-title { padding:12px 16px; background:var(--surface2); font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); }
  .detail-row { display:flex; justify-content:space-between; align-items:flex-start; padding:12px 16px; border-top:1px solid rgba(255,255,255,0.04); gap:10px; }
  .detail-label { font-size:12px; color:var(--text-muted); flex-shrink:0; }
  .detail-value { font-size:12px; color:var(--text2); text-align:right; }

  /* Fund safety note */
  .safe-badge { background:rgba(0,229,160,0.08); border:1px solid rgba(0,229,160,0.25); border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .safe-icon { font-size:20px; flex-shrink:0; }
  .safe-text { font-size:13px; color:var(--text); font-weight:500; }

  /* Actions */
  .action-title { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin:16px 0 10px; }
  .action-list { display:flex; flex-direction:column; gap:10px; }
  .action-card { background:var(--surface); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; border:1px solid transparent; transition:all 0.2s; }
  .action-card:hover { border-color:rgba(0,212,255,0.3); }
  .action-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .action-icon.cyan { background:rgba(0,212,255,0.1); }
  .action-icon.purple { background:rgba(139,63,232,0.1); }
  .action-icon.green { background:rgba(0,229,160,0.1); }
  .action-info { flex:1; }
  .action-name { font-size:14px; font-weight:600; }
  .action-desc { font-size:12px; color:var(--text-muted); margin-top:2px; }
  .action-arrow { color:var(--text-muted); font-size:16px; }

  .cta-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:linear-gradient(transparent,var(--black) 30%); padding:16px; }
  .retry-btn { width:100%; padding:16px; background:linear-gradient(135deg,var(--blue),var(--purple)); border:none; border-radius:14px; color:#fff; font-size:16px; font-weight:700; cursor:pointer; margin-bottom:10px; }
  .home-btn { width:100%; padding:13px; background:transparent; border:1px solid var(--surface3); border-radius:14px; color:var(--text2); font-size:15px; cursor:pointer; }

  .toast { position:fixed; bottom:130px; left:50%; transform:translateX(-50%) translateY(60px); background:var(--surface2); color:var(--text); padding:12px 20px; border-radius:12px; font-size:13px; font-weight:500; transition:transform 0.3s; z-index:200; border:1px solid rgba(0,229,160,0.3); white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); }

  /* GOD MODE: topbar history button */
  .topbar-actions { margin-left:auto; display:flex; gap:8px; }
  .icon-btn { width:36px; height:36px; border:none; background:var(--surface2); border-radius:10px; color:var(--text2); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .icon-btn:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }

  /* GOD MODE: bottom sheet (error history) */
  .sheet-overlay { position:fixed; inset:0; background:rgba(9,10,16,0.7); z-index:300; opacity:0; pointer-events:none; transition:opacity 0.25s; }
  .sheet-overlay.show { opacity:1; pointer-events:auto; }
  .bottom-sheet { position:fixed; left:50%; bottom:0; transform:translate(-50%,100%); width:100%; max-width:430px; background:var(--surface); border-radius:20px 20px 0 0; z-index:301; transition:transform 0.3s cubic-bezier(0.32,0.72,0,1); max-height:75vh; display:flex; flex-direction:column; }
  .bottom-sheet.show { transform:translate(-50%,0); }
  .sheet-handle { width:36px; height:4px; background:var(--surface3); border-radius:2px; margin:10px auto 4px; }
  .sheet-header { display:flex; align-items:center; justify-content:space-between; padding:10px 18px 14px; border-bottom:1px solid rgba(255,255,255,0.06); }
  .sheet-title { font-size:15px; font-weight:700; }
  .sheet-clear { font-size:12px; color:var(--red); background:none; border:none; cursor:pointer; padding:6px; }
  .sheet-clear:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  .sheet-body { padding:6px 18px 24px; overflow-y:auto; }
  .history-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
  .history-icon { width:32px; height:32px; border-radius:9px; background:rgba(255,77,109,0.1); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .history-info { flex:1; }
  .history-title { font-size:13px; font-weight:600; }
  .history-time { font-size:11px; color:var(--text-muted); margin-top:2px; }
  .history-empty { text-align:center; padding:30px 10px; color:var(--text-muted); font-size:13px; }

  /* GOD MODE: live retry countdown */
  .retry-countdown { background:var(--surface2); border-radius:12px; padding:14px 16px; margin:16px 0; }
  .rc-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .rc-label { font-size:12px; color:var(--text2); }
  .rc-time { font-size:13px; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; }
  .rc-track { height:6px; background:var(--surface3); border-radius:3px; overflow:hidden; }
  .rc-fill { height:100%; background:linear-gradient(90deg,var(--cyan),var(--purple)); border-radius:3px; transition:width 1s linear; }
  .rc-ready .rc-time { color:var(--green); }

  /* GOD MODE: diagnostic report action icon */
  .action-icon.gold { background:rgba(255,184,0,0.1); }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="topbar-title">Transaction Issue</span>
  <div class="topbar-actions">
    <button class="icon-btn" id="historyBtn" onclick="openHistorySheet()" aria-label="View recent issues" aria-haspopup="dialog">🕘</button>
  </div>
</div>

<div class="error-types">
  <div class="error-tab active" onclick="setError('network',this)">Network</div>
  <div class="error-tab" onclick="setError('funds',this)">Insufficient Funds</div>
  <div class="error-tab" onclick="setError('compliance',this)">Compliance Hold</div>
  <div class="error-tab" onclick="setError('timeout',this)">Timeout</div>
  <div class="error-tab" onclick="setError('slippage',this)">Slippage</div>
</div>

<div class="content" id="errorContent"></div>

<div class="cta-bar">
  <button class="retry-btn" id="retryBtn" onclick="retryTxn()">Try Again</button>
  <button class="home-btn" onclick="window.location.href='citizen-dashboard.html'">Back to Dashboard</button>
</div>

<div class="toast" id="toast"></div>

<div class="sheet-overlay" id="historyOverlay" onclick="closeHistorySheet()"></div>
<div class="bottom-sheet" id="historySheet" role="dialog" aria-modal="true" aria-label="Recent issues">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title">Recent Issues</span>
    <button class="sheet-clear" onclick="clearErrorHistory()">Clear</button>
  </div>
  <div class="sheet-body" id="historyBody"></div>
</div>

<script>
const ERRORS = {
  network: {
    icon: '📡',
    title: 'Network interruption',
    code: 'ERR-NET-001',
    siindex: "Your transfer didn't go through the Solana network briefly wasn't responding. Your funds were never moved. I've already queued a retry. Tap below when ready. Standing by.",
    details: [
      ['Transaction', '50 INDX to Maria Santos'],
      ['Status', 'Not submitted no funds moved'],
      ['Network', 'Solana temporary congestion'],
      ['Time', '2:47 PM, 15 June 2026'],
    ],
    actions: ['retry','home','support'],
    retryLabel: 'Try Again Network is Clear',
    retryWait: 0
  },
  funds: {
    icon: '💳',
    title: 'Insufficient balance',
    code: 'ERR-BAL-001',
    siindex: "Your transfer couldn't complete you need 150 INDX but your balance is 98.5 INDX. You have a few options: top up, reduce the amount, or use a different asset. No funds were moved. Standing by.",
    details: [
      ['Attempted', '150 INDX ($36.00)'],
      ['Your balance', '98.5 INDX ($23.64)'],
      ['Shortfall', '51.5 INDX ($12.36)'],
      ['Status', 'Not submitted no funds moved'],
    ],
    actions: ['topup','reduce','support'],
    retryLabel: 'Top Up Wallet',
    retryWait: 0
  },
  compliance: {
    icon: '🛡️',
    title: 'Compliance hold',
    code: 'ERR-COMP-001',
    siindex: "I've placed a temporary hold on this transfer. It triggered a compliance check not because anything is wrong, but because your transfer amount requires a 30-second verification step. Your funds are safe. Tap below to complete the check. Standing by.",
    details: [
      ['Transaction', '$1,200 USDC to external wallet'],
      ['Reason', 'FATF Travel Rule transfers >$1,000'],
      ['Hold type', 'Temporary pending identity step'],
      ['Estimated time', '30 seconds to resolve'],
    ],
    actions: ['verify','support'],
    retryLabel: 'Complete Verification (30 sec)',
    retryWait: 30
  },
  timeout: {
    icon: '⏱️',
    title: 'Transaction timed out',
    code: 'ERR-TIME-001',
    siindex: "Your transaction was submitted but didn't confirm within the expected window. This sometimes happens during high network activity. Check the transaction status first it may have confirmed. If not, it's safe to retry. Your funds have not been moved twice. Standing by.",
    details: [
      ['Transaction hash', 'Ax7f...3kp9'],
      ['Submitted', '2:44 PM, 15 June 2026'],
      ['Timeout after', '30 seconds (no confirmation)'],
      ['Action needed', 'Check status, then retry if unconfirmed'],
    ],
    actions: ['status','retry','support'],
    retryLabel: 'Check Status & Retry',
    retryWait: 0
  },
  slippage: {
    icon: '📉',
    title: 'Slippage too high',
    code: 'ERR-SLIP-001',
    siindex: "I stopped this swap the market moved while your order was being processed, and the price slipped 2.3% beyond your 1% tolerance. Your funds are untouched. You can retry with a higher slippage tolerance, or wait for the market to settle. Standing by.",
    details: [
      ['Swap', '100 USDC → INDX'],
      ['Expected price', '$0.24 per INDX'],
      ['Actual price', '$0.243 per INDX'],
      ['Slippage', '2.3% exceeded 1% tolerance'],
    ],
    actions: ['adjust','retry','support'],
    retryLabel: 'Retry with Higher Tolerance',
    retryWait: 0
  }
};

function setError(type, el) {
  document.querySelectorAll('.error-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const err = ERRORS[type];
  document.getElementById('retryBtn').textContent = err.retryLabel;
  // GOD MODE PATCH: cancel any running countdown and reset the retry button when switching error types
  clearInterval(countdownTimer);
  document.getElementById('retryBtn').disabled = false;
  document.getElementById('retryBtn').style.opacity = '1';

  // GOD MODE PATCH: use the citizen's real balance (if known) for the funds error, instead of static copy
  let detailsToRender = type === 'funds' ? buildFundsDetails(err.details) : err.details;
  let detailRows = detailsToRender.map(([l,v]) =>
    `<div class="detail-row"><span class="detail-label">${l}</span><span class="detail-value">${v}</span></div>`
  ).join('');

  document.getElementById('errorContent').innerHTML = `
    <div class="error-hero">
      <div class="error-icon-ring">${err.icon}</div>
      <div class="error-title">${err.title}</div>
      <div class="error-code">${err.code}</div>
    </div>

    <div class="safe-badge">
      <div class="safe-icon">✅</div>
      <div class="safe-text">Your funds are safe. Nothing was moved.</div>
    </div>

    ${renderRetryCountdown(err)}

    <div class="si-card">
      <div class="si-avatar">⚡</div>
      <div>
        <div class="si-name">SIINDEX</div>
        <div class="si-text">${personalizeGreeting(err.siindex)}</div>
      </div>
    </div>

    <div class="detail-card">
      <div class="detail-title">What happened</div>
      ${detailRows}
    </div>

    <div class="action-title">What you can do</div>
    <div class="action-list">
      <div class="action-card" onclick="window.location.href='siindex-chat.html'">
        <div class="action-icon purple">🤖</div>
        <div class="action-info">
          <div class="action-name">Talk to SIINDEX</div>
          <div class="action-desc">I'll guide you through the next step</div>
        </div>
        <span class="action-arrow">›</span>
      </div>
      <div class="action-card" onclick="window.location.href='history.html'">
        <div class="action-icon cyan">📋</div>
        <div class="action-info">
          <div class="action-name">View Transaction History</div>
          <div class="action-desc">See the full status on-chain</div>
        </div>
        <span class="action-arrow">›</span>
      </div>
      <div class="action-card" onclick="copyDiagnostics('${type}')">
        <div class="action-icon gold">📄</div>
        <div class="action-info">
          <div class="action-name">Copy Diagnostic Report</div>
          <div class="action-desc">Copy details to share with support</div>
        </div>
        <span class="action-arrow">›</span>
      </div>
      <div class="action-card" onclick="window.location.href='sovereign-support.html'">
        <div class="action-icon green">👤</div>
        <div class="action-info">
          <div class="action-name">Speak to a Human</div>
          <div class="action-desc">Escalate to our support team</div>
        </div>
        <span class="action-arrow">›</span>
      </div>
    </div>
  `;

  // GOD MODE PATCH: record this error view in the local history log and start a live countdown when applicable
  logErrorView(type, err);
  if (err.retryWait > 0) startRetryCountdown(err.retryWait);
}

function retryTxn() {
  showToast('Resubmitting transaction. Standing by.');
  setTimeout(() => { history.back(); }, 1800);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// GOD MODE: live retry countdown, error history log, smart defaults, diagnostic report
const INDX_PRICE_USD = 0.24;
let countdownTimer = null;

function personalizeGreeting(text) {
  const name = sessionStorage.getItem('citizen_name');
  if (!name) return text;
  return `Hey ${name}, ` + text.charAt(0).toLowerCase() + text.slice(1);
}

function buildFundsDetails(defaultDetails) {
  const rawBalance = sessionStorage.getItem('citizen_balance');
  const balance = rawBalance !== null ? parseFloat(rawBalance) : NaN;
  if (isNaN(balance)) return defaultDetails;
  const attempted = 150;
  const shortfall = Math.max(attempted - balance, 0);
  return [
    ['Attempted', `${attempted} INDX ($${(attempted * INDX_PRICE_USD).toFixed(2)})`],
    ['Your balance', `${balance.toFixed(2)} INDX ($${(balance * INDX_PRICE_USD).toFixed(2)})`],
    ['Shortfall', `${shortfall.toFixed(2)} INDX ($${(shortfall * INDX_PRICE_USD).toFixed(2)})`],
    ['Status', 'Not submitted no funds moved'],
  ];
}

function renderRetryCountdown(err) {
  if (!err.retryWait || err.retryWait <= 0) return '';
  return `
    <div class="retry-countdown" id="retryCountdown">
      <div class="rc-row">
        <span class="rc-label">Verification in progress</span>
        <span class="rc-time" id="rcTime">${err.retryWait}s</span>
      </div>
      <div class="rc-track"><div class="rc-fill" id="rcFill" style="width:100%"></div></div>
    </div>
  `;
}

function startRetryCountdown(seconds) {
  clearInterval(countdownTimer);
  const wrap = document.getElementById('retryCountdown');
  const timeEl = document.getElementById('rcTime');
  const fillEl = document.getElementById('rcFill');
  const btn = document.getElementById('retryBtn');
  if (!wrap || !timeEl || !fillEl || !btn) return;
  let remaining = seconds;
  btn.disabled = true;
  btn.style.opacity = '0.5';
  countdownTimer = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(countdownTimer);
      timeEl.textContent = 'Ready';
      fillEl.style.width = '0%';
      wrap.classList.add('rc-ready');
      btn.disabled = false;
      btn.style.opacity = '1';
      return;
    }
    timeEl.textContent = remaining + 's';
    fillEl.style.width = (remaining / seconds * 100) + '%';
  }, 1000);
}

function logErrorView(type, err) {
  const history = JSON.parse(localStorage.getItem('indx_txnerror_history') || '[]');
  history.unshift({ type, title: err.title, code: err.code, icon: err.icon, time: new Date().toLocaleString() });
  localStorage.setItem('indx_txnerror_history', JSON.stringify(history.slice(0, 10)));
}

function openHistorySheet() {
  const history = JSON.parse(localStorage.getItem('indx_txnerror_history') || '[]');
  const body = document.getElementById('historyBody');
  body.innerHTML = history.length
    ? history.map(h => `
      <div class="history-item">
        <div class="history-icon">${h.icon}</div>
        <div class="history-info">
          <div class="history-title">${h.title}</div>
          <div class="history-time">${h.code} · ${h.time}</div>
        </div>
      </div>
    `).join('')
    : `<div class="history-empty">No issues viewed yet this session.</div>`;
  document.getElementById('historySheet').classList.add('show');
  document.getElementById('historyOverlay').classList.add('show');
  document.addEventListener('keydown', historyEscHandler);
  const firstFocusable = document.getElementById('historySheet').querySelector('button');
  if (firstFocusable) firstFocusable.focus();
}

function closeHistorySheet() {
  document.getElementById('historySheet').classList.remove('show');
  document.getElementById('historyOverlay').classList.remove('show');
  document.removeEventListener('keydown', historyEscHandler);
  document.getElementById('historyBtn').focus();
}

function historyEscHandler(e) {
  if (e.key === 'Escape') { closeHistorySheet(); return; }
  if (e.key === 'Tab') {
    const sheet = document.getElementById('historySheet');
    const focusables = sheet.querySelectorAll('button');
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}

function clearErrorHistory() {
  localStorage.setItem('indx_txnerror_history', '[]');
  openHistorySheet();
  showToast('History cleared. Standing by.');
}

function copyDiagnostics(type) {
  const err = ERRORS[type];
  const citizenId = sessionStorage.getItem('citizen_id') || 'unknown';
  const report = [
    `IN$DEX Diagnostic Report`,
    `Error: ${err.title} (${err.code})`,
    `Citizen ID: ${citizenId}`,
    `Time: ${new Date().toLocaleString()}`
  ].join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(report).then(() => {
      showToast('Diagnostic report copied. Standing by.');
    }).catch(() => {
      showToast('Could not copy. Standing by.');
    });
  } else {
    showToast('Copy not supported on this device.');
  }
}

// Init
setError('network', document.querySelector('.error-tab.active'));
</script>
<script src="siindex-speak-core.js"></script>
</body>
</html>
