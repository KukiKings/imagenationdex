<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="assets/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Sovereign Rankings IN$DEX</title>
  <style>
    :root{--cyan:#00D4FF;--blue:#2B35D8;--purple:#8B3FE8;--black:#090A10;--green:#00E5A0;--gold:#FFB800;--red:#FF4D6D;--surface:#12141F;--surface2:#1A1D2E;--surface3:#22263A;--border:rgba(255,255,255,0.07);--text:#F0F2FF;--text-muted:rgba(240,242,255,0.45);--text-dim:rgba(240,242,255,0.2);}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{background:var(--black);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
    .phone{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
    .topbar{display:flex;align-items:center;padding:14px 16px 10px;gap:10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--black);z-index:20;}
    .tb-back{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:none;color:var(--text);font-size:18px;cursor:pointer;}
    .tb-title{flex:1;font-size:17px;font-weight:800;}
    .scroll-body{flex:1;overflow-y:auto;padding-bottom:40px;}
    .tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--black);position:sticky;top:57px;z-index:15;}
    .tab{flex:1;padding:11px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;}
    .tab.active{color:var(--cyan);border-bottom-color:var(--cyan);}
    .period-row{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--border);}
    .period-btn{flex:1;padding:7px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;color:var(--text-muted);text-align:center;}
    .period-btn.active{background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.3);color:var(--cyan);}
    .podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:24px 16px 0;background:linear-gradient(180deg,rgba(139,63,232,0.04),transparent);}
    .podium-place{display:flex;flex-direction:column;align-items:center;gap:6px;}
    .pod-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:3px solid transparent;}
    .pod-name{font-size:11px;font-weight:700;text-align:center;}
    .pod-score{font-size:11px;color:var(--text-muted);}
    .pod-base{border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;padding:8px 12px;font-size:18px;font-weight:900;}
    .my-rank-bar{margin:14px;background:linear-gradient(135deg,rgba(0,212,255,0.08),rgba(43,53,216,0.05));border:1px solid rgba(0,212,255,0.15);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;}
    .mrb-rank{font-size:22px;font-weight:900;color:var(--cyan);width:42px;text-align:center;flex-shrink:0;}
    .mrb-body{flex:1;}
    .mrb-name{font-size:14px;font-weight:800;}
    .mrb-detail{font-size:11px;color:var(--text-muted);margin-top:1px;}
    .mrb-score{font-size:20px;font-weight:900;color:var(--cyan);}
    .section{padding:0 14px 14px;}
    .rank-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
    .rank-item:last-child{border-bottom:none;}
    .rank-item.me{background:rgba(0,212,255,0.04);margin:0 -14px;padding:11px 14px;}
    .ri-rank{font-size:16px;font-weight:900;width:30px;text-align:center;flex-shrink:0;}
    .ri-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .ri-body{flex:1;}
    .ri-name{font-size:14px;font-weight:700;}
    .ri-detail{font-size:11px;color:var(--text-muted);margin-top:1px;}
    .ri-score{text-align:right;flex-shrink:0;}
    .ri-val{font-size:15px;font-weight:800;}
    .ri-sub{font-size:10px;color:var(--text-muted);}
    .change-up{color:var(--green);}
    .change-dn{color:var(--red);}
    #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(26,29,46,0.97);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;}

    /* GOD MODE — LEADERBOARD */
    /* F2: Search bar */
    .lb-search-wrap{padding:10px 14px;border-bottom:1px solid var(--border);}
    .lb-search{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:14px;color:var(--text);outline:none;}
    .lb-search:focus{border-color:rgba(0,212,255,0.35);}
    .lb-search::placeholder{color:var(--text-muted);}

    /* F1: Live drift flash */
    @keyframes lbFlashUp{0%{background:rgba(0,229,160,0.18);}100%{background:transparent;}}
    @keyframes lbFlashDn{0%{background:rgba(255,77,109,0.12);}100%{background:transparent;}}
    .flash-up{animation:lbFlashUp 0.8s ease;}
    .flash-dn{animation:lbFlashDn 0.8s ease;}
    .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px;vertical-align:middle;animation:sdot 2s ease-in-out infinite;}
    @keyframes sdot{0%,100%{opacity:1}50%{opacity:0.2}}

    /* F3: Progress bar to next rank */
    .mrb-progress-wrap{margin-top:8px;}
    .mrb-progress-label{font-size:10px;color:var(--text-muted);margin-bottom:4px;display:flex;justify-content:space-between;}
    .mrb-progress-track{height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;}
    .mrb-progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:3px;transition:width 1s ease;}

    /* F4: Share chip */
    .mrb-share{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:7px 14px;border-radius:20px;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.25);font-size:12px;font-weight:700;color:var(--cyan);cursor:pointer;transition:background 0.2s;}
    .mrb-share:active{background:rgba(0,212,255,0.15);}
  </style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <button class="tb-back" onclick="history.back()">←</button>
    <div class="tb-title">🏆 Sovereign Rankings</div>
  </div>
  <div class="tab-bar">
    <div class="tab active" id="tabWisdom" onclick="switchTab('wisdom')">Wisdom Score</div>
    <div class="tab" id="tabReferrers" onclick="switchTab('referrers')">Referrers</div>
    <div class="tab" id="tabTraders" onclick="switchTab('traders')">Traders</div>
    <div class="tab" id="tabDelivery" onclick="switchTab('delivery')">Delivery</div>
  </div>

  <div class="scroll-body" id="scrollBody">

    <!-- YOUR STANDING (real data only) -->
    <div class="my-rank-bar" id="myRankBar" style="flex-direction:column;align-items:stretch;gap:0;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="mrb-body"><div class="mrb-name" id="mrbName">You</div><div class="mrb-detail" id="mrbDetail">Wisdom Score</div></div>
        <div class="mrb-score" id="mrbScore">–</div>
      </div>
    </div>

    <!-- LIST — honest empty state: no cross-citizen leaderboard is live yet -->
    <div class="section" id="rankList">
      <div class="rank-item" style="flex-direction:column;align-items:flex-start;gap:6px;border-bottom:none;padding:24px 0;text-align:center;">
        <div style="width:100%;text-align:center;font-size:28px;">🏆</div>
        <div style="width:100%;text-align:center;font-size:13px;font-weight:700;color:var(--text);">Rankings open once citizens start earning</div>
        <div style="width:100%;text-align:center;font-size:12px;color:var(--text-muted);line-height:1.5;">This leaderboard will show real citizens once the Republic launches. No names below are real yet.</div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
// There is no cross-citizen leaderboard RPC/table live yet — building one
// (with proper privacy-safe anonymisation) is a backend feature, not a
// content fix, so it isn't built here. Rather than fabricate names and
// scores, every tab shows the same honest "not live yet" state, and "your
// standing" reflects only the real signed-in citizen's own Wisdom Score.
const TABS=['Wisdom','Referrers','Traders','Delivery'];
let activeTab='wisdom';

function switchTab(t){
  TABS.forEach(id=>document.getElementById('tab'+id.charAt(0).toUpperCase()+id.slice(1)).classList.toggle('active',id===t));
  activeTab=t;
}

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',2500);}

// Real data only — your own Wisdom Score from the current session, no
// invented rank or percentile.
function syncMyRank(){
  const ws=sessionStorage.getItem('citizen_wisdom');
  const name=sessionStorage.getItem('citizen_name');
  document.getElementById('mrbName').textContent = name ? 'You · '+name : 'You';
  document.getElementById('mrbScore').textContent = ws !== null ? ws : '–';
}

document.addEventListener('DOMContentLoaded',()=>{
  syncMyRank();
});
</script>
<script src="siindex-speak-core.js"></script>
</body>
</html>
