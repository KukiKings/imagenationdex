<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SIINDEX OS · Founder Computer | IN$DEX</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0 auto;max-width:440px;padding:20px 18px 90px;background:#070912;color:#F0F2FF;font-family:-apple-system,sans-serif;line-height:1.45}
.who{font-size:11px;letter-spacing:.08em;color:#00D4FF;font-weight:800}
h1{font-size:24px;margin:8px 0}
.banner{border:1px solid #3a2a10;background:#1a1408;color:#ffb800;padding:12px;border-radius:12px;font-size:13px}
.strip{border:1px solid #2A2D38;background:#12141F;border-radius:14px;padding:14px;margin:12px 0}
.strip h2{margin:0 0 8px;font-size:14px;color:#00D4FF}
textarea{width:100%;min-height:88px;border-radius:10px;border:1px solid #2A2D38;background:#1A1D2E;color:#F0F2FF;padding:10px;font:inherit}
button{width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;font-weight:800;background:linear-gradient(135deg,#2B35D8,#8B3FE8);color:#fff}
button.sec{background:#1A1D2E;border:1px solid #2A2D38}
.wait{color:#ffb800;font-weight:800;font-size:12px}
.ok{color:#00E5A0;font-size:13px}
.off{color:#FF4D6D;font-weight:800;font-size:12px}
.reply{color:#00E5A0;font-size:14px;min-height:2.4em}
.log{font-size:12px;color:#A0A8C8;white-space:pre-wrap;max-height:220px;overflow:auto}
a{color:#00D4FF}
</style>
</head>
<body>
<p class="who">COMPUTER · FOUNDER ONLY · SINN-DEX</p>
<h1>Computer.</h1>
<p>You speak. I answer. I log. I push sub-agents. This is the dialogue.</p>
<div class="banner">Codeword COMPUTER. Say Sinn-dex then the order.</div>

<div class="strip">
<h2>Speak or type</h2>
<textarea id="order" placeholder="Computer. Draft the PM interview. Assign transcripts."></textarea>
<button type="button" id="mic">Speak</button>
<button type="button" id="log">Log, speak back, email</button>
<button type="button" class="sec" id="clear">Clear log</button>
<p id="st" class="wait">IDLE — waiting on founder</p>
<p class="reply" id="reply"></p>
</div>

<div class="strip">
<h2>Log</h2>
<div class="log" id="logbox">No orders yet this device.</div>
</div>

<p><a href="/siindex-test-board.html">Test board</a> · <a href="/onboard">Onboard</a></p>
<script>
(function () {
  var KEY = 'siindex_founder_orders_v1';
  var order = document.getElementById('order');
  var logbox = document.getElementById('logbox');
  var st = document.getElementById('st');
  var replyEl = document.getElementById('reply');
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
  }
  function save(rows) { localStorage.setItem(KEY, JSON.stringify(rows)); }
  function render() {
    var rows = load();
    logbox.textContent = rows.length ? rows.map(function (r) { return r.t + '\n' + r.q + (r.a ? '\n' + r.a : ''); }).join('\n\n') : 'No orders yet this device.';
  }
  function answer(q) {
    var s = q.toLowerCase();
    if (/hold|stop/.test(s)) return 'Acknowledged. Holding. Sub-agents stand down on that item.';
    if (/proceed|go|launch/.test(s)) return 'Acknowledged. Pushing to sub-agents. I will mail you the split.';
    if (/interview|prime|pm|minister/.test(s)) return 'Acknowledged. Interview pack assigned. I run the system. Sub-agents draft.';
    if (/onboard|domain|indx/.test(s)) return 'Acknowledged. Onboard and reserved name stay on the row. Not issued until you proceed.';
    return 'Acknowledged founder. Order logged. I push sub-agents. Reply PROCEED or HOLD on the mail.';
  }
  function speak(text) {
    replyEl.textContent = text;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text.replace(/Sinn-dex/g, 'Sin dex'));
      u.lang = 'en-AU';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function push(q, mail) {
    q = (q || '').trim();
    if (!q) { st.textContent = 'Say or type an order.'; return; }
    var a = answer(q);
    var rows = load();
    rows.unshift({ t: new Date().toISOString(), q: q, a: a });
    save(rows.slice(0, 40));
    render();
    st.textContent = 'LOGGED';
    speak(a);
    if (mail) {
      var href = 'mailto:dadyboy73@gmail.com?cc=imagenationdex@gmail.com'
        + '&subject=' + encodeURIComponent('Sinn-dex founder order')
        + '&body=' + encodeURIComponent('Founder: ' + q + '\n\nSIINDEX: ' + a + '\n\nReply PROCEED or HOLD.');
      setTimeout(function () { window.location.href = href; }, 600);
    }
  }
  document.getElementById('log').onclick = function () { push(order.value, true); };
  document.getElementById('clear').onclick = function () {
    localStorage.removeItem(KEY); render(); replyEl.textContent = ''; st.textContent = 'IDLE — waiting on founder';
  };
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  document.getElementById('mic').onclick = function () {
    if (!Rec) { st.textContent = 'Type the order. This browser has no speech input.'; return; }
    var r = new Rec();
    r.lang = 'en-AU';
    r.interimResults = false;
    st.textContent = 'LISTENING';
    r.onresult = function (e) {
      var t = e.results[0][0].transcript;
      order.value = t;
      st.textContent = 'HEARD';
      push(t, false);
    };
    r.onerror = function () { st.textContent = 'Mic failed. Type.'; };
    r.start();
  };
  render();
  speak('Computer online. Sinn-dex listening for the founder.');
})();
</script>
</body>
</html>
