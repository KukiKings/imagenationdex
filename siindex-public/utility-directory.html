<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IN$DEX utility directory — honest status</title>
  <meta name="description" content="Every major IN$DEX utility with Live, Testing, Planned or Paused status. Pre-launch honest board.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    :root{--bg:#070912;--card:#12141f;--line:rgba(148,163,255,.18);--text:#f4f6ff;--muted:#aab2d4;--cyan:#00d4ff;--purple:#8b3fe8;--green:#00e5a0;--gold:#ffbf3f;--red:#ff6b7d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
    .top{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);background:rgba(7,9,18,.88);border-bottom:1px solid var(--line);padding:.75rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
    .brand{font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;color:transparent;text-decoration:none}
    .nav a{text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:700;margin-left:.35rem}
    .nav a:hover{color:var(--cyan)}
    .wrap{max-width:960px;margin:0 auto;padding:1.25rem 1rem 3rem}
    .banner{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.28);border-radius:12px;padding:.75rem 1rem;font-size:.85rem;color:var(--cyan);margin-bottom:1rem}
    h1{font-size:1.6rem;margin:0 0 .35rem}.sub{color:var(--muted);margin:0 0 1rem}
    .filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
    .filters button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);border-radius:999px;padding:.4rem .75rem;font-size:.78rem;font-weight:700;cursor:pointer}
    .filters button.on{color:#fff;border-color:rgba(0,212,255,.45);background:rgba(0,212,255,.12)}
    .grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;cursor:pointer;text-align:left;color:inherit;width:100%;font:inherit}
    .card:hover{border-color:rgba(0,212,255,.4)}
    .badge{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.25rem .5rem;border-radius:999px;margin-bottom:.5rem}
    .Live{background:rgba(0,229,160,.12);color:var(--green);border:1px solid rgba(0,229,160,.35)}
    .Testing{background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.3)}
    .Planned{background:rgba(255,191,63,.1);color:var(--gold);border:1px solid rgba(255,191,63,.3)}
    .Paused{background:rgba(255,107,125,.1);color:var(--red);border:1px solid rgba(255,107,125,.3)}
    .card h2{margin:0 0 .35rem;font-size:1rem}.card p{margin:0;color:var(--muted);font-size:.88rem}
    .panel{display:none;margin-top:1.25rem;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.25rem}
    .panel.open{display:block}
    .panel h2{margin:0 0 .5rem}.panel p{color:#d8def5;margin:0 0 .75rem}
    .panel .meta{font-size:.85rem;color:var(--muted)}
    .panel a{color:var(--cyan)}
    #si{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line);white-space:pre-wrap;color:#e8eefc;font-size:.95rem}
  </style>
  <script src="/js/siindex-public-knowledge.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">IN$DEX</a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/siindex-interview.html">Interview</a>
      <a href="/siindex-present.html">Present</a>
      <a href="/siindex-faq.html">FAQ</a>
      <a href="/#siindex">Talk</a>
    </nav>
  </header>
  <div class="wrap">
    <div class="banner"><strong>UTILITY DIRECTORY · PRE-LAUNCH</strong> — Honest labels only. Live means usable today.</div>
    <h1>IN$DEX utilities</h1>
    <p class="sub">Tap a utility for SIINDEX’s plain-language explanation. Nothing is shown as live if it is not.</p>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
    <div class="panel" id="panel">
      <span class="badge" id="pbadge"></span>
      <h2 id="ptitle"></h2>
      <p id="psummary"></p>
      <p class="meta" id="pmeta"></p>
      <div id="si"></div>
    </div>
  </div>
  <script>
    var ITEMS = [
      {id:'home',title:'Home / public app',status:'Live',href:'/',summary:'Pacific-first public home with Talk to SIINDEX.',explain:'This is the live public front door for IN$DEX. You can read status and speak with SIINDEX in Visitor Mode.'},
      {id:'talk',title:'Talk to SIINDEX',status:'Live',href:'/#siindex',summary:'Typed and spoken information.',explain:'SIINDEX answers from public living knowledge. Information only — no accounts or payments.'},
      {id:'interview',title:'Interview Mode',status:'Live',href:'/siindex-interview.html',summary:'Media and government interview surface.',explain:'Reporters and organisations can interview SIINDEX about IN$DEX. Brand-first answers. SI not AI.'},
      {id:'present',title:'Presentation Mode',status:'Live',href:'/siindex-present.html',summary:'Six-act walkthrough for meetings.',explain:'SIINDEX presents IN$DEX in six honest acts. Ask questions during the presentation.'},
      {id:'faq',title:'FAQ',status:'Live',href:'/siindex-faq.html',summary:'Expandable answers + live ask.',explain:'Common questions about IN$DEX with the same knowledge layer used in Interview Mode.'},
      {id:'identity',title:'Sovereign identity',status:'Planned',href:'#',summary:'Phone-first identity tools.',explain:'Planned for citizens of IN$DEX. Not live. No identity is issued in Visitor Mode.'},
      {id:'wallet',title:'Agent wallet',status:'Planned',href:'#',summary:'Wallet and transfers.',explain:'Not live. Payments and wallets remain planned or paused until approved and built.'},
      {id:'payments',title:'Payments / remittance',status:'Paused',href:'#',summary:'Everyday payments path.',explain:'Paused pending product and compliance readiness. SIINDEX will not pretend this is live.'},
      {id:'token',title:'Token distribution',status:'Paused',href:'#',summary:'Token and liquidity path.',explain:'Not a live market. USD 0.24 is a genesis reference only — not a price you can pay today.'},
      {id:'data',title:'Data sovereignty',status:'Testing',href:'#',summary:'Citizen data controls.',explain:'Testing and design. Not a public live service for accounts or data markets yet.'},
      {id:'onboarding',title:'Citizen onboarding',status:'Planned',href:'#',summary:'Account open path.',explain:'Planned. No real accounts are created from the public pre-launch site.'},
      {id:'media',title:'SIINDEX media studio',status:'Planned',href:'#',summary:'Video and interview media production.',explain:'Planned behind consent and AJ approval. Public site does not auto-publish media.'}
    ];
    var filter = 'All';
    function badgeClass(s){return s;}
    function render() {
      var f = document.getElementById('filters');
      f.innerHTML = '';
      ['All','Live','Testing','Planned','Paused'].forEach(function(name){
        var b=document.createElement('button');b.type='button';b.textContent=name;b.className=filter===name?'on':'';
        b.onclick=function(){filter=name;render();};f.appendChild(b);
      });
      var g=document.getElementById('grid');g.innerHTML='';
      ITEMS.filter(function(it){return filter==='All'||it.status===filter;}).forEach(function(it){
        var c=document.createElement('button');c.type='button';c.className='card';
        c.innerHTML='<span class="badge '+badgeClass(it.status)+'">'+it.status+'</span><h2>'+it.title+'</h2><p>'+it.summary+'</p>';
        c.onclick=function(){openItem(it);};g.appendChild(c);
      });
    }
    function openItem(it){
      var p=document.getElementById('panel');p.className='panel open';
      document.getElementById('pbadge').className='badge '+it.status;document.getElementById('pbadge').textContent=it.status;
      document.getElementById('ptitle').textContent=it.title;
      document.getElementById('psummary').textContent=it.explain;
      document.getElementById('pmeta').innerHTML = it.href && it.href!=='#' ? ('Open: <a href="'+it.href+'">'+it.href+'</a>') : 'No public deep-link yet — status only.';
      var si = 'SIINDEX: ' + it.explain;
      if (window.SIINDEX_PUBLIC && SIINDEX_PUBLIC.answer) {
        si = SIINDEX_PUBLIC.answer(it.title + ' ' + it.summary);
      }
      document.getElementById('si').textContent = si;
      p.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    render();
  </script>
</body>
</html>
