<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IN$DEX · Utility directory (pre-launch)</title>
  <style>
    :root { --bg:#0b1220; --card:#141e33; --text:#e8eefc; --muted:#9aabcc; --live:#3ddc97; --testing:#f5c542; --planned:#6b8cff; --paused:#ff7a7a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); line-height:1.45; }
    main { max-width: 920px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.35rem; }
    .sub { color: var(--muted); margin-bottom: 1.25rem; }
    .banner { background: var(--card); border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 1.25rem; border: 1px solid #243152; }
    .grid { display: grid; gap: 0.75rem; }
    a.card { display:block; text-decoration:none; color:inherit; background:var(--card); border-radius:12px; padding:0.9rem 1rem; border:1px solid #243152; }
    a.card:hover { border-color: #3a4f7a; }
    .title { font-weight: 600; }
    .summary { color: var(--muted); font-size: 0.92rem; margin-top: 0.25rem; }
    .badge { display:inline-block; font-size:0.72rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:0.2rem 0.45rem; border-radius:999px; margin-top:0.45rem; }
    .Live { background: rgba(61,220,151,0.15); color: var(--live); }
    .Testing { background: rgba(245,197,66,0.15); color: var(--testing); }
    .Planned { background: rgba(107,140,255,0.15); color: var(--planned); }
    .Paused { background: rgba(255,122,122,0.15); color: var(--paused); }
    .links { margin-top: 1.5rem; font-size: 0.9rem; color: var(--muted); }
    .links a { color: #7dd3fc; }
    .err { color: #ff9b9b; }
  </style>
  <script src="/js/siindex-public-boot.js" defer></script>
</head>
<body>
  <main>
    <h1>IN$DEX utility directory</h1>
    <p class="sub">Pre-launch status board. Live means usable today. No demo wording.</p>
    <div class="banner">
      <strong>SIINDEX</strong> can explain each utility. Status labels are honest: Live · Testing · Planned · Paused.
    </div>
    <div class="grid" id="grid"><p class="muted">Loading directory…</p></div>
    <p class="links">
      <a href="/siindex-interview.html">Interview SIINDEX</a> ·
      <a href="/siindex-present.html">Presentation Mode</a> ·
      <a href="/speak-to-siindex.html">Speak to SIINDEX</a> ·
      <a href="/public-home.html">Public home</a>
    </p>
  </main>
  <script>
    fetch('/siindex-public/utility-directory.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var grid = document.getElementById('grid');
        grid.innerHTML = '';
        (data.sections || []).forEach(function (s) {
          var a = document.createElement('a');
          a.className = 'card';
          a.href = '/' + String(s.href || '').replace(/^\//, '');
          a.innerHTML =
            '<div class="title">' + (s.title || s.id) + '</div>' +
            '<div class="summary">' + (s.summary || '') + '</div>' +
            '<span class="badge ' + (s.status || 'Planned') + '">' + (s.status || 'Planned') + '</span>';
          grid.appendChild(a);
        });
      })
      .catch(function () {
        document.getElementById('grid').innerHTML = '<p class="err">Could not load utility-directory.json. Check the branch preview.</p>';
      });
  </script>
</body>
</html>
