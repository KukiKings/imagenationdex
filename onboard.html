<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Onboard | IN$DEX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}body{margin:0 auto;max-width:430px;padding:24px 20px 80px;background:#090A10;color:#F0F2FF;font-family:-apple-system,sans-serif}
.banner{border:1px solid #3a2a10;background:#1a1408;color:#ffb800;padding:10px 12px;border-radius:10px;font-size:13px}
h1{font-size:24px;margin:16px 0 8px}p{color:#8B90A8;line-height:1.5}
label{display:block;font-size:12px;color:#8B90A8;margin:12px 0 6px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #2A2D38;background:#1A1D2E;color:#F0F2FF}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#2B35D8,#8B3FE8);color:#fff;font-weight:700}
.out{margin-top:16px;font-size:13px;white-space:pre-wrap}.ok{color:#00E5A0}.bad{color:#FF4D6D}a{color:#00D4FF}
.step{font-size:12px;color:#00D4FF;font-weight:700}
</style>
</head>
<body>
<div class="banner">STEP 1. Login is the email <strong>Sign in</strong> link (not a 6-digit code unless AJ changes the Auth template). .INDX not issued.</div>
<p class="step">ESTHER PATH · ONBOARD FIRST</p>
<h1>Start like Esther.</h1>
<p>Name. Phone. Then click the link in your email. Come back here and Save.</p>
<label>Your name</label>
<input id="name" placeholder="Esther" autocomplete="name">
<label>Phone (the till)</label>
<input id="phone" type="tel" placeholder="+682 …" autocomplete="tel">
<label>Name you want</label>
<input id="handle" placeholder="esther" autocapitalize="off">
<p id="preview" style="margin:6px 0;color:#00E5A0"></p>
<label>Email</label>
<input id="email" type="email" autocomplete="email" placeholder="you@email.com">
<button type="button" id="send">Send sign-in email</button>
<label>Optional 6-digit code (only if your email shows one)</label>
<input id="otp" inputmode="numeric" maxlength="8" placeholder="usually empty — use the link">
<button type="button" id="verify">Verify code if you have one</button>
<label>Where are you</label>
<input id="region" value="Cook Islands">
<label>Date of birth (optional)</label>
<input id="dob" type="date">
<label>Guardian email if under 18</label>
<input id="guardian" type="email" placeholder="parent@email.com">
<button type="button" id="save">Save onboarding preview</button>
<div class="out" id="out"></div>
<p><a href="/coconut-till.html">Esther's till</a> · <a href="/launch">Path</a> · <a href="/">Home</a></p>
<script>
(function () {
  var SB_URL = 'https://zljgthfzbalsunuoohcd.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsamd0aGZ6YmFsc3VudW9vaGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1ODc1NTIsImV4cCI6MjA5NzE2MzU1Mn0.5xNG-E4R9OOHEm7Gq6qHVn5Hkq2mqoGRrL5aHHYwvVA';
  var REDIR = 'https://imagenationdex.com/onboard';
  var out = document.getElementById('out');
  function say(m, ok) { out.className = 'out ' + (ok ? 'ok' : 'bad'); out.textContent = m; }
  var sb;
  try {
    if (!window.supabase) throw new Error('supabase-js did not load');
    sb = window.supabase.createClient(SB_URL, SB_KEY, {
      auth: { detectSessionInUrl: true, persistSession: true, flowType: 'pkce' }
    });
  } catch (e) { say('Client failed: ' + (e && e.message ? e.message : e)); return; }

  async function consumeLink() {
    var q = new window.URLSearchParams(window.location.search);
    var h = new window.URLSearchParams(window.location.hash.replace(/^#/, ''));
    var token_hash = q.get('token_hash') || h.get('token_hash');
    var type = q.get('type') || h.get('type') || 'email';
    if (token_hash) {
      var v = await sb.auth.verifyOtp({ token_hash: token_hash, type: type });
      if (v.error) say('Link verify: ' + v.error.message);
      else say('Signed in from email link. Save next.', true);
      return;
    }
    var sess = await sb.auth.getSession();
    if (sess.data && sess.data.session) say('Already signed in. Save when ready.', true);
  }
  consumeLink();

  document.getElementById('handle').addEventListener('input', function () {
    var h = document.getElementById('handle').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    document.getElementById('preview').textContent = h ? h + '.INDX — reserved later, not issued' : '';
  });
  document.getElementById('send').onclick = async function () {
    var email = document.getElementById('email').value.trim();
    if (email.indexOf('@') < 0) return say('Enter an email.');
    try {
      var res = await sb.auth.signInWithOtp({
        email: email,
        options: { shouldCreateUser: true, emailRedirectTo: REDIR }
      });
      say(res.error ? res.error.message : 'Email sent. Open Sign in. It should return to this page.', !res.error);
    } catch (e) { say('Send failed: ' + (e && e.message ? e.message : e)); }
  };
  document.getElementById('verify').onclick = async function () {
    var token = document.getElementById('otp').value.trim();
    if (!token) return say('No code in the email. Use the Sign in link instead.');
    try {
      var res = await sb.auth.verifyOtp({ email: document.getElementById('email').value.trim(), token: token, type: 'email' });
      say(res.error ? res.error.message : 'Signed in. Save next.', !res.error);
    } catch (e) { say('Verify failed: ' + (e && e.message ? e.message : e)); }
  };
  document.getElementById('save').onclick = async function () {
    try {
      var sess = await sb.auth.getSession();
      if (!sess.data || !sess.data.session) return say('Open the Sign in link in the email first.');
      var name = document.getElementById('name').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var h = document.getElementById('handle').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!name || !phone) return say('Name and phone are required.');
      var display = name + (h ? ' / ' + h + '.INDX' : '') + ' / ' + phone;
      var res = await sb.rpc('upsert_tier0_profile', {
        p_display_name: display,
        p_region: document.getElementById('region').value,
        p_date_of_birth: document.getElementById('dob').value || null,
        p_guardian_email: document.getElementById('guardian').value || null
      });
      if (res.error) return say('Save error: ' + res.error.message);
      say('Preview saved. .INDX not issued. Solana Pay not live.\n' + JSON.stringify(res.data, null, 2), true);
    } catch (e) { say('Save failed: ' + (e && e.message ? e.message : e)); }
  };
})();
</script>
</body>
</html>
